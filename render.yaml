# Render Blueprint for the Misuq API (dashboard: New → Blueprint → this repo).
# Secrets marked `sync: false` are entered in the Render dashboard when the
# Blueprint is created — never committed. The JWT secrets are generated by
# Render (generateValue: two independent random values, each well over the
# 32 chars src/modules/auth/auth.config.ts requires).
services:
  - type: web
    name: misuq-api
    runtime: node
    # Frankfurt: closest Render region to the founders being onboarded; create
    # the Neon database in AWS eu-central-1 (Frankfurt) to match.
    region: frankfurt
    # free sleeps after ~15 min idle (first request then takes ~30-60s).
    # Switch to `starter` for an always-on beta.
    plan: free
    # The Prisma steps live in package.json, not here: the live service
    # (misuq_api) was created in the dashboard, so Render runs the dashboard's
    # commands and ignores this file. `npm run build` runs `prisma generate`
    # first. Without it, Render's cached node_modules keep a client generated
    # from the previous schema, and tsc fails with exit 2 (2026-11-04).
    # --include=dev: the TypeScript compiler and the Prisma CLI are
    # devDependencies, and `prisma migrate deploy` runs at start.
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` applies pending migrations, then starts. migrate deploy only
    # ever runs committed migrations (it never resets or generates), so it's
    # safe on every boot. A failed migration stops this boot, and Render keeps
    # the previous deploy live.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon connection string, the DIRECT (non-pooled) one, with
      # sslmode=require. Prisma migrations need a direct connection.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Switching drafting/extraction to Claude (code is ready, off by
      # default): in the Render dashboard add ANTHROPIC_API_KEY, then set
      # DRAFTING_LLM=claude and EXTRACTION_LLM=claude. Kept out of this file
      # on purpose: selecting claude without a key stops the server at boot.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The deployed web app's origin, e.g. https://misuq.pages.dev
      - key: CORS_ORIGIN
        sync: false
      # One proxy hop (Render's load balancer) for the client IP the rate
      # limiter keys on. See src/main.ts trustProxyHops().
      - key: TRUST_PROXY
        value: "1"
